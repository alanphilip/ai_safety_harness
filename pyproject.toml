[project]
name = "ai-safety-harness"
version = "0.1.0"
description = "AI Safety Harness project"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "deepeval>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"